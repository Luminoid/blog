# Hexo Configuration (Version 8.1.1)
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Luminoid's Site
subtitle: OK Computer
description: Dispatches from the terminal
keywords: 
author: Luminoid
language: 
  - en
  # - zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blog.luminoid.dev
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: docs
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - _headers

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: true
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -updated

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
  - .DS_Store
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

# Local Search
search:
  path: search.xml
  field: post
  content: true
  format: html

# Feed (RSS/Atom)
## Docs: https://github.com/hexojs/hexo-generator-feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20

# Post Wordcount
## Docs: https://github.com/next-theme/hexo-word-counter
symbols_count_time:
  awl: 5 # EN ≈ 5, CN ≈ 2
  wpm: 200 # Slow ≈ 200, Normal ≈ 275, Fast ≈ 350

# Mermaid house style
## Injected into every {% mermaid %} diagram at build time by scripts/mermaid-theme.js.
## Everything except flowchart_classes becomes the diagram's %%{init}%% directive
## (palette and font, matching the blog's figures). flowchart_classes are appended to
## flowcharts as classDef lines, so a post can tag nodes with :::outline, :::accent,
## or :::muted; untagged nodes get the light-blue primary look. A diagram that starts
## with its own %%{init}%% directive is left alone.
mermaid_theme:
  theme: base
  fontFamily: SF Pro Text, Helvetica Neue, Arial, sans-serif
  themeVariables:
    fontFamily: SF Pro Text, Helvetica Neue, Arial, sans-serif
    primaryColor: '#CFDFF6'
    primaryBorderColor: '#2E6FD6'
    primaryTextColor: '#1F3F7A'
    lineColor: '#2E6FD6'
    textColor: '#333333'
    edgeLabelBackground: '#FFFFFF'
    clusterBkg: '#F7F9FD'
    clusterBorder: '#BBBBBB'
    noteBkgColor: '#F2F2F2'
    noteBorderColor: '#777777'
    noteTextColor: '#333333'
    actorLineColor: '#BBBBBB'
    signalColor: '#2E6FD6'
    signalTextColor: '#333333'
  flowchart_classes:
    outline: fill:#FFFFFF,stroke:#2E6FD6,stroke-width:1.5px,color:#1F3F7A
    accent: fill:#1F3F7A,stroke:#1F3F7A,stroke-width:1.5px,color:#FFFFFF
    muted: fill:#FFFFFF,stroke:#777777,stroke-width:1.5px,stroke-dasharray:6 4,color:#555555
